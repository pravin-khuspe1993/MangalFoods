<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Mangal Foods</title>
  <meta name="description" content="Complete your order and place it on WhatsApp." />
  <link rel="stylesheet" href="./lib/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="./css/site.css" />
</head>
<body class="page-shell" data-delivery-charge="80" data-free-delivery-threshold="1000" data-whatsapp-number="919594928299" data-business-name="Mangal Foods" data-whatsapp-dry-run="false">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div data-site-header></div>
  <main id="main-content" role="main" class="main-content">
    <section class="py-4 py-lg-5">
      <div class="container-xl">
        <h1 class="h2 mb-4">Checkout</h1>
        <div class="row g-4">
          <div class="col-lg-7">
            <form id="checkoutForm" novalidate autocomplete="on">
              <h2 class="h5 mb-3">Customer Details</h2>
              <div class="row g-3">
                <div class="col-md-6"><label for="Input_FullName" class="form-label">Full Name</label><input id="Input_FullName" class="form-control" autocomplete="name" /></div>
                <div class="col-md-6"><label for="Input_MobileNumber" class="form-label">Mobile Number</label><input id="Input_MobileNumber" class="form-control" autocomplete="tel" inputmode="numeric" /></div>
                <div class="col-md-6"><label for="Input_WhatsAppNumber" class="form-label">WhatsApp Number</label><input id="Input_WhatsAppNumber" class="form-control" autocomplete="tel" inputmode="numeric" /></div>
                <div class="col-md-6"><label for="Input_Email" class="form-label">Email</label><input id="Input_Email" class="form-control" autocomplete="email" /></div>
              </div>

              <h2 class="h5 mt-4 mb-3">Delivery Details</h2>
              <div class="row g-3">
                <div class="col-12"><label for="Input_Address" class="form-label">Address</label><textarea id="Input_Address" class="form-control" rows="3" autocomplete="street-address"></textarea></div>
                <div class="col-12"><label for="Input_Landmark" class="form-label">Landmark</label><input id="Input_Landmark" class="form-control" /></div>
                <div class="col-md-4"><label for="Input_City" class="form-label">City</label><input id="Input_City" class="form-control" autocomplete="address-level2" /></div>
                <div class="col-md-4"><label for="Input_State" class="form-label">State</label><input id="Input_State" class="form-control" autocomplete="address-level1" /></div>
                <div class="col-md-4"><label for="Input_PinCode" class="form-label">Pin Code</label><input id="Input_PinCode" class="form-control" autocomplete="postal-code" inputmode="numeric" /></div>
              </div>

              <h2 class="h5 mt-4 mb-3">Optional</h2>
              <div class="row g-3">
                <div class="col-12"><label for="Input_GiftMessage" class="form-label">Gift Message</label><textarea id="Input_GiftMessage" class="form-control" rows="2"></textarea></div>
                <div class="col-12"><label for="Input_SpecialInstructions" class="form-label">Special Instructions</label><textarea id="Input_SpecialInstructions" class="form-control" rows="2"></textarea></div>
              </div>

              <div id="checkoutError" class="alert alert-danger mt-4 d-none" role="alert"></div>
              <div class="mt-3">
                <button type="button" id="placeOrderWhatsApp" class="btn btn-success w-100 js-place-order-whatsapp" aria-label="Place Order on WhatsApp"><i class="bi bi-whatsapp me-1" aria-hidden="true"></i>Place Order on WhatsApp</button>
              </div>

              <section id="whatsappDryRunPanel" class="dry-run-panel mt-4 d-none" aria-labelledby="dry-run-heading">
                <h2 id="dry-run-heading" class="h6 mb-2">WhatsApp Dry Run Preview</h2>
                <p class="small text-muted mb-2">Dry Run is enabled. No WhatsApp message will be sent. Review and copy the generated output below.</p>
                <div class="mb-3"><label for="dryRunWaUrl" class="form-label">Generated WhatsApp URL</label><textarea id="dryRunWaUrl" class="form-control" rows="3" readonly></textarea></div>
                <div><label for="dryRunMessage" class="form-label">Generated Message</label><textarea id="dryRunMessage" class="form-control" rows="12" readonly></textarea></div>
              </section>
            </form>
          </div>
          <div class="col-lg-5">
            <h2 class="h5 mb-3">Order Summary</h2>
            <div id="checkoutItems" class="d-grid gap-3 mb-3"></div>
            <section class="cart-summary card border-0 shadow-sm rounded-4" aria-labelledby="cart-summary-title-checkout">
              <div class="card-body">
                <h2 id="cart-summary-title-checkout" class="h6 mb-3">Order Summary</h2>
                <dl class="row mb-0">
                  <dt class="col-7">Subtotal</dt><dd class="col-5 text-end" id="summarySubtotal">₹0</dd>
                  <dt class="col-7">Delivery</dt><dd class="col-5 text-end" id="summaryDelivery">₹0</dd>
                  <dt class="col-7 fw-semibold">Total</dt><dd class="col-5 text-end fw-semibold" id="summaryTotal">₹0</dd>
                </dl>
              </div>
            </section>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div><div data-cart-drawer-host></div>
  <script src="./lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/static-config.js"></script>
  <script src="./js/static-layout.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/site.js"></script>
  <script src="./js/checkout.js"></script>
</body>
</html>
