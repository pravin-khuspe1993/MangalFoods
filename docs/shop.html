<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop | Mangal Foods</title>
  <meta name="description" content="Browse premium sweets, savouries, festive and gifting collections." />
  <link rel="stylesheet" href="./lib/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="./css/site.css" />
</head>
<body class="page-shell" data-page-path="/shop" data-delivery-charge="80" data-free-delivery-threshold="1000" data-whatsapp-number="919594928299" data-business-name="Mangal Foods" data-whatsapp-dry-run="true">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div data-site-header></div>

  <main id="main-content" role="main" class="main-content">
    <section class="py-4 py-lg-5">
      <div class="container-xl">
        <header class="mb-4">
          <h1 class="h2 mb-2">Shop All Products</h1>
          <p class="text-muted mb-0">Browse premium sweets, savouries, festive and gifting collections.</p>
        </header>

        <div class="row g-4">
          <aside class="col-lg-3">
            <section class="product-filters" aria-labelledby="filters-heading">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 id="filters-heading" class="h6 mb-0">Filters</h2>
                <button type="button" class="btn btn-outline-dark btn-sm d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#mobileFilters" aria-controls="mobileFilters">Open Filters</button>
              </div>
              <div class="d-none d-lg-block filter-panel p-3 rounded-4">
                <div class="mb-3">
                  <label for="filterCategory" class="form-label">Category</label>
                  <select id="filterCategory" class="form-select js-filter" data-filter="category">
                    <option value="">All Categories</option>
                    <option value="Sweets">Sweets</option>
                    <option value="Savouries">Savouries</option>
                    <option value="Gift Hampers">Gift Hampers</option>
                    <option value="Festive Collection">Festive Collection</option>
                    <option value="Corporate Gifting">Corporate Gifting</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="filterPrice" class="form-label">Max Price</label>
                  <input id="filterPrice" type="range" class="form-range js-filter" data-filter="price" min="100" max="5000" step="100" value="5000" />
                </div>
                <div class="form-check mb-2"><input class="form-check-input js-filter" type="checkbox" id="filterBestseller" data-filter="bestseller" /><label class="form-check-label" for="filterBestseller">Bestseller only</label></div>
                <div class="form-check mb-2"><input class="form-check-input js-filter" type="checkbox" id="filterFeatured" data-filter="featured" /><label class="form-check-label" for="filterFeatured">Featured only</label></div>
                <div class="form-check mb-3"><input class="form-check-input js-filter" type="checkbox" id="filterVegetarian" data-filter="vegetarian" /><label class="form-check-label" for="filterVegetarian">Vegetarian only</label></div>
                <div class="mb-3">
                  <label for="sortBy" class="form-label">Sort by</label>
                  <select id="sortBy" class="form-select js-filter" data-filter="sort">
                    <option value="featured">Featured</option>
                    <option value="bestseller">Bestseller</option>
                    <option value="price-asc">Price low to high</option>
                    <option value="price-desc">Price high to low</option>
                    <option value="name-asc">Name A-Z</option>
                  </select>
                </div>
              </div>
              <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileFilters" aria-labelledby="mobileFiltersLabel">
                <div class="offcanvas-header">
                  <h3 class="offcanvas-title h5" id="mobileFiltersLabel">Filter Products</h3>
                  <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close filters"></button>
                </div>
                <div class="offcanvas-body">
                  <div class="mb-3">
                    <label for="filterCategoryMobile" class="form-label">Category</label>
                    <select id="filterCategoryMobile" class="form-select" disabled><option>Use desktop filters panel</option></select>
                  </div>
                </div>
              </div>
            </section>
          </aside>
          <div class="col-lg-9">
            <div class="mb-4">
              <form method="get" action="shop.html" class="search-bar reveal reveal-up" role="search" aria-label="Product search">
                <label for="pageSearch" class="visually-hidden">Search products</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                  <input id="pageSearch" type="search" name="q" class="form-control" placeholder="Search by name, category, or tag" />
                  <button class="btn btn-dark" type="submit">Search</button>
                </div>
              </form>
            </div>
            <div id="productGridRoot" data-shop-grid></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <div data-cart-drawer-host></div>

  <script src="./lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/static-config.js"></script>
  <script src="./js/static-layout.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/site.js"></script>
  <script src="./js/static-catalog.js"></script>
</body>
</html>
