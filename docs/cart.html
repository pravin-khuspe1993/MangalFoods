<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | Mangal Foods</title>
  <meta name="description" content="Review your cart and proceed to checkout." />
  <link rel="stylesheet" href="./lib/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="./css/site.css" />
</head>
<body class="page-shell" data-delivery-charge="80" data-free-delivery-threshold="1000" data-whatsapp-number="919594928299" data-business-name="Mangal Foods" data-whatsapp-dry-run="true">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div data-site-header></div>
  <main id="main-content" role="main" class="main-content">
    <section class="py-4 py-lg-5">
      <div class="container-xl">
        <h1 class="h2 mb-4 reveal reveal-up">Your Cart</h1>
        <div class="row g-4">
          <div class="col-lg-8">
            <div id="cartItemsContainer" class="d-grid gap-3" aria-live="polite"></div>
            <div id="cartEmptyState" class="empty-state p-4 text-center d-none">
              <h2 class="h5">Your cart is empty</h2>
              <p class="text-muted">Add premium sweets and savouries to continue.</p>
              <a href="shop.html" class="btn btn-dark">Continue Shopping</a>
            </div>
            <button id="clearCartButton" type="button" class="btn btn-outline-dark mt-3">Clear Cart</button>
          </div>
          <div class="col-lg-4">
            <section class="cart-summary card border-0 shadow-sm rounded-4" aria-labelledby="cart-summary-title-page">
              <div class="card-body">
                <h2 id="cart-summary-title-page" class="h6 mb-3">Order Summary</h2>
                <dl class="row mb-0">
                  <dt class="col-7">Subtotal</dt><dd class="col-5 text-end" id="summarySubtotal">₹0</dd>
                  <dt class="col-7">Delivery</dt><dd class="col-5 text-end" id="summaryDelivery">₹0</dd>
                  <dt class="col-7 fw-semibold">Total</dt><dd class="col-5 text-end fw-semibold" id="summaryTotal">₹0</dd>
                </dl>
              </div>
            </section>
            <a href="checkout.html" class="btn btn-dark w-100 mt-3">Proceed to Checkout</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <div data-cart-drawer-host></div>
  <script src="./lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/static-config.js"></script>
  <script src="./js/static-layout.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/site.js"></script>
</body>
</html>
