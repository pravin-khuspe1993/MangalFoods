<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Mangal Foods</title>
  <meta name="description" content="For orders, gifting, and bulk inquiries, reach out to Mangal Foods." />
  <link rel="stylesheet" href="./lib/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="./css/site.css" />
</head>
<body class="page-shell" data-delivery-charge="80" data-free-delivery-threshold="1000" data-whatsapp-number="919594928299" data-business-name="Mangal Foods" data-whatsapp-dry-run="true">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div data-site-header></div>
  <main id="main-content" role="main" class="main-content">
    <section class="py-4 py-lg-5">
      <div class="container-xl">
        <h1 class="h2 mb-3">Contact Us</h1>
        <p class="text-muted mb-4">For orders, gifting, and bulk inquiries, reach out and we’ll help curate your selection.</p>
        <div class="row g-4">
          <div class="col-lg-6">
            <div class="p-4 rounded-4 bg-white shadow-sm">
              <h2 class="h5">Get in touch</h2>
              <p class="mb-2"><strong>Phone:</strong> +91 95949 28299</p>
              <p class="mb-2"><strong>Email:</strong> hello@mangalfoods.in</p>
              <p class="mb-0"><strong>Address:</strong> Bandra West, Mumbai, Maharashtra 400050</p>
            </div>
          </div>
          <div class="col-lg-6">
            <form class="p-4 rounded-4 bg-white shadow-sm" action="contact.html" method="get">
              <div class="mb-3"><label for="contactName" class="form-label">Name</label><input id="contactName" class="form-control" /></div>
              <div class="mb-3"><label for="contactEmail" class="form-label">Email</label><input id="contactEmail" type="email" class="form-control" /></div>
              <div class="mb-3"><label for="contactMessage" class="form-label">Message</label><textarea id="contactMessage" class="form-control" rows="3"></textarea></div>
              <button type="submit" class="btn btn-dark">Submit</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <div data-cart-drawer-host></div>
  <script src="./lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/static-config.js"></script>
  <script src="./js/static-layout.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/site.js"></script>
</body>
</html>
